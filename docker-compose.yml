name: nba_project

services:
  pg_db:
    image: postgres:16
    container_name: pg_db
    environment:
      - POSTGRES_USER=your_user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=your_db
    restart: on-failure
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:z        # Изменена инит-папка!
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7.2-alpine
    container_name: redis
    command:
      - redis-server
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  pgdata:
    driver: local
  redis_data:
    driver: local
